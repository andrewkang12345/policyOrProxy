# shifts.yaml
# Each shift entry is one point in the alpha sweep.
# Interpretation: higher alpha => more aggressive bias toward high mean-x starting frames.

seed: 0

shifts:
  right_bias_alpha_0p0:
    alpha: 0.0

  right_bias_alpha_0p5:
    alpha: 0.05

  right_bias_alpha_1p0:
    alpha: 0.1

  right_bias_alpha_2p0:
    alpha: 0.2

  right_bias_alpha_4p0:
    alpha: 0.4

  right_bias_alpha_8p0:
    alpha: 0.8

  right_bias_alpha_16p0:
    alpha: 1.6
