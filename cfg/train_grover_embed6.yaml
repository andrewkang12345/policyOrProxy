# ============================================
# Grover et al. policy-representation training
# ============================================

data:
  # Use explicit per-split experiment lists (train/val only). Or delete this block
  # and set `data.category: iid` to auto-discover all policies like your CVAE script.
  experiment:
    train:
      - {path: "output/data/ego_policy1/iid"}
      - {path: "output/data/ego_policy2/iid"}
    val:
      - {path: "output/data/ego_policy1/iid"}
      - {path: "output/data/ego_policy2/iid"}
  # category: iid

seed: 17
device: auto
prefer_free_gpu: true

window_len: 50
epochs: 20
batch_size: 64
num_workers: 4
validate_interval: 2000   # (not used directly; kept for consistency)
max_grad_norm: 5.0

optimizer:
  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.0

loss:
  lambda_id: 0.10           # weight for identification (triplet) loss
  gaussian_min_logvar: -6.0 # clamp for stability

model:
  # Environment / feature dimensions (match your datasets)
  teams: 2
  agents: 1
  state_dim: 4
  action_dim: 2

  # Representation + policy architecture
  embed_dim: 100
  encoder_hidden: 256
  policy_hidden: 256
  dropout: 0.1

paths:
  data_root: output/data
  run_dir: output/runs/grover_embed_experiment6