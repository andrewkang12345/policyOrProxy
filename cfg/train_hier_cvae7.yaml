# File: policyOrProxy/cfg/train_hier_cvae.yaml
# ============================================
# Hierarchical CVAE training config (train/val only)
# ============================================

# ------------------------
# DATA SELECTION
# ------------------------
data:
  # Option A: train on every policy under a single distribution
  # category: iid
  # Option B: explicit lists
  experiment:
    train:
      # - {path: "output/data/ego_policy1/iid"}
      - {path: "output/data/ood_manual/ego_policy2/right_bias_mild"}
      - {path: "output/data/ood_manual/ego_policy1/right_bias_mild"}
      # - {path: "output/data/ego_policy1/iid"}
      # - {path: "output/data/ego_policy2/iid"}

    val:
      # - {path: "output/data/ego_policy1/iid"}
      - {path: "output/data/ood_manual/ego_policy2/right_bias_mild"}
      - {path: "output/data/ood_manual/ego_policy1/right_bias_mild"}
      # - {path: "output/data/ego_policy1/iid"}
      # - {path: "output/data/ego_policy2/iid"}

# ------------------------
# GLOBAL SETTINGS
# ------------------------
seed: 19
device: auto
prefer_free_gpu: true

# ------------------------
# TRAINING HYPERPARAMETERS
# ------------------------
window_len: 6
epochs: 20
batch_size: 32
num_workers: 4
validate_interval: 2000
max_grad_norm: 5.0

latent_dim:
  global: 32
  local: 16

# ------------------------
# OPTIMIZER
# ------------------------
optimizer:
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.0

# ------------------------
# LEARNING RATE SCHEDULER
# ------------------------
scheduler:
  warmup_steps: 2500
  min_lr: 1.0e-5

# ------------------------
# MODEL CONFIGURATION
# ------------------------
model:
  encoder_dim: 256
  encoder_layers: 4
  encoder_heads: 4
  dropout: 0.1
  action_dim: 2
  agents: 1
  teams: 2
  state_dim: 4
  reconstruction_loss: smooth_l1   # kept for parity; not used directly here

# ------------------------
# PATHS
# ------------------------
paths:
  data_root: output/data
  run_dir: output/runs/hier_cvae_experiment7
